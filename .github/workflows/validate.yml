name: Validate and publish Actionfleet plugins
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests
      - run: python scripts/catalog.py --check
      - name: Refuse package changes without a release (main only; scripts/land.py adds the release)
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            python scripts/release_version.py check
          else
            python scripts/release_version.py check || echo "::warning title=Release::scripts/land.py adds the release before main"
          fi
      - name: Check new commit messages (warnings; scripts/land.py and the commit-msg hook refuse)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="HEAD~1..HEAD"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; fi
          python plugins/extras/skills/commit-messages/scripts/commit.py check --public --range "$range" \
            || echo "::warning title=Commit messages::Some subjects in $range aren't Conventional Commits; see this step's log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build a synthetic endpoint package for structural validation
        run: python scripts/build.py --mcp-url https://mcp.example.com/mcp --output "$RUNNER_TEMP/actionfleet-validation"
      - name: Validate Claude compatibility without connecting an account
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-plugin-validation
        run: |
          npm exec --yes --package @anthropic-ai/claude-code@2.1.300 -- claude plugin validate "$RUNNER_TEMP/actionfleet-validation/plugins/actionfleet" --strict
          npm exec --yes --package @anthropic-ai/claude-code@2.1.300 -- claude plugin validate "$RUNNER_TEMP/actionfleet-validation" --strict
          npm exec --yes --package @anthropic-ai/claude-code@2.1.300 -- claude plugin validate packages/actionfleet-dev --strict
          npm exec --yes --package @anthropic-ai/claude-code@2.1.300 -- claude plugin validate packages/actionfleet --strict
          npm exec --yes --package @anthropic-ai/claude-code@2.1.300 -- claude plugin validate . --strict
      - name: Check what Codex loads from each package without signing in
        run: |
          npm install --global @openai/codex@0.162.1
          python scripts/check_codex_package.py
      - name: Build reviewed active packages
        run: python scripts/catalog.py --archives "$RUNNER_TEMP/actionfleet-release"
      - uses: actions/upload-artifact@v4
        with:
          name: actionfleet-plugins
          path: ${{ runner.temp }}/actionfleet-release/*
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check anonymous OAuth contracts without registering clients
        run: python scripts/probe_endpoints.py --output endpoint-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actionfleet-endpoints
          path: endpoint-status.json
  release:
    needs: [validate, endpoints]
    if: github.ref == 'refs/heads/main' && github.repository == 'actionfleetai/actionfleet-plugin'
    runs-on: ubuntu-latest
    concurrency:
      group: actionfleet-plugin-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: actionfleet-plugins
          path: release
      - name: Publish an immutable prerelease for the plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/release_version.py --field version)
          label=$(python3 scripts/release_version.py --field label)
          tag="v$version"
          # A published release never changes: what hosts install must match its tag.
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            git diff --exit-code "$tag" -- packages .agents/plugins .claude-plugin .cursor-plugin
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir previous-release
            gh release download "$tag" --pattern SHA256SUMS --dir previous-release
            cmp previous-release/SHA256SUMS release/SHA256SUMS
          else
            python3 -m pip install --quiet git-cliff==2.14.2
            {
              git cliff --config cliff.toml --unreleased --tag "$tag" --strip header
              echo
              echo '### Plugins'
              echo
              python3 scripts/release_version.py check --notes
              echo
              echo 'Install from the Git marketplace; see the README for each host. Hosts offer an update only for plugins marked updated. Actionfleet (production) is listed but not installable until its OAuth and native acceptance pass. Assets are deterministic ZIPs with SHA-256 sums.'
            } > release-notes.md
            gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
              --title "Actionfleet $label" --notes-file release-notes.md
          fi
